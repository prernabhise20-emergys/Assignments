<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="#">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
  <nav>
    <img src="final-removebg-preview.png" class="logo">
    <h1>Personal Expense Tracker</h1>
  </nav>

  <div class="container">
    <div class="balance-section">
      <div class="balance-card">
        <h3>Income</h3>
        <p>Rs. <span id="incomeAmount">0.00</span></p>

      </div>
      <div class="balance-card">
        <h3>Expense</h3>
        <p>Rs. <span id="expenseAmount">0.00</span></p>
      </div>
      <div class="balance-card">
        <h3>Balance</h3>
        <p>Rs. <span id="balanceAmount">0.00</span></p>
      </div>
    </div>
    <div class="filterdiv">
      <button class="add-expense-btn" onclick="openExpensePopup()">+ Add Transaction</button>
      <select id="sortingDropdown" class="sorting-dropdown">
        <option value="default">Sort By</option>
        <option value="date">Date</option>
        <option value="amount-high-to-low">Amount (High to Low)</option>
        <option value="amount-low-to-high">Amount (Low to High)</option>
      </select>
      <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search Your Expense Here...">
      </div>
    </div>

  </div>
  <h2 id="title">Expenses Table</h2>
  <div class="tablecard">
    <div class="expense-list">
      <table id="expenseTable">
        <thead>
          <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr id="expense_1">
            <td>Food</td>
            <td>50</td>
            <td>2025-01-01</td>
            <td>Food</td>
            <td>

              <button class="edit-btn" onclick="editExpense(1)">&#128393;</button>
              <button class="delete-btn" onclick="deleteExpense(1)">&#128465;</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>


  <div class="second-container">
    <div id="chartSection" class="chart1">

      <canvas id="myChart" width="400" height="200"></canvas>
    </div>
    <div id="chartSection" class="chart2">
      <canvas id="monthlyChart" width="400" height="200"></canvas>
    </div>
  </div>

  <div id="expensePopup" class="popup">
    <div class="popup-content">
      <div class="status">
        <div class="status-tab active" data-filter="all" onclick="openExpensePopup()">Expense</div>
        <div class="status-tab" data-filter="pending" onclick="openIncomePopup()">Income</div>
      </div>
      <div id="successMessage">
        Expense added successfully!
      </div>
      <span id="expenseLimitError"></span>
      <h2>Add Expense</h2>
      <span id="descriptionError" class="error-message"></span>
      <input type="text" id="description" minlength="2" maxlength="30" placeholder="Expense Description" />

      <span id="amountError" class="error-message"></span>
      <input type="number" id="amount" minlength="1" maxlength="30" placeholder="Amount" />

      <span id="dateError" class="error-message"></span>
      <input type="date" id="date" />

      <span id="categoryError" class="error-message"></span>
      <select id="category">
        <option value="SelectCategory" selected hidden>Select Category</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Rent">Rent</option>
        <option value="Others">Others</option>
      </select>
      <button onclick="addExpense()">Add Expense</button>
      <button onclick="closeExpensePopup()">Close</button>
    </div>
  </div>

  <div id="incomePopup" class="popup">
    <div class="popup-content">
      <div class="status">
        <div class="status-tab" data-filter="all" onclick="openExpensePopup()">Expense</div>
        <div class="status-tab active" data-filter="pending" onclick="openIncomePopup()">Income</div>
      </div>
      <h2>Add Income</h2>
      <span id="incomeError" class="error-message"></span>
      <input type="number" id="incomeInput" placeholder="Enter Income" />
      <button onclick="addIncome()">Add Income</button>
      <button onclick="closeIncomePopup()">Close</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
